<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrik' de Lilly</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
height:100vh;
background: linear-gradient(180deg,#f8f4ef,#efe5dd);
overflow:hidden;
}

/* TITRE EN HAUT */
.header{
position:absolute;
top:20px;
width:100%;
text-align:center;
font-size:28px;
font-weight:400;
letter-spacing:1px;
color:#2b2b2b;
}

/* LOGO CENTRÉ */
.logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:350px;
opacity:0.35;
}

/* BAS DE PAGE */
.footer{
position:absolute;
bottom:60px;
width:100%;
text-align:center;
}

/* TEXTE */
.footer p{
font-size:18px;
margin-bottom:20px;
color:#5e5e5e;
line-height:1.6;
}

/* BOUTON */
.btn{
display:inline-block;
padding:16px 35px;
background:#2b2b2b;
color:white;
text-decoration:none;
border-radius:40px;
transition:0.3s;
}

.btn:hover{
background:#444;
transform:translateY(-3px);
}

</style>
</head>

<body>

<!-- HAUT -->
<div class="header">
La Fabrik' de Lilly
</div>

<!-- LOGO CENTRE -->
<img class="logo" src="images/logo-ll.jpg" alt="logo">

<!-- BAS -->
<div class="footer">

<p>
Bougies parfumées artisanales, fondants, sprays d’ambiance et créations parfumées
</p>

<a class="btn" href="menu.html">
Découvrir la boutique
</a>

</div>

</body>
</html>
