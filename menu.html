<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boutique - La Fabrik' de Lilly</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
height:100vh;
overflow:hidden;
background:#f8f4ef;
}

/* LOGO FOND IDENTIQUE */
body::before{
content:"";
position:fixed;
inset:0;
background:url("images/logo-ll.jpg") center/80% no-repeat;
opacity:0.22;
z-index:-1;
animation: float 6s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0px);}
}

/* HEADER */
.header{
position:absolute;
top:20px;
width:100%;
text-align:center;
font-size:38px;
letter-spacing:3px;
}

/* HAMBURGER BUTTON */
.menu-btn{
position:absolute;
top:25px;
left:25px;
font-size:30px;
cursor:pointer;
background:rgba(255,255,255,0.8);
padding:10px 15px;
border-radius:10px;
z-index:10;
}

/* SIDEBAR MENU */
.sidebar{
position:fixed;
top:0;
left:-280px;
width:260px;
height:100%;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(8px);
box-shadow:5px 0 20px rgba(0,0,0,0.15);
padding-top:80px;
transition:0.4s;
z-index:20;
}

/* ACTIVE */
.sidebar.active{
left:0;
}

/* LINKS */
.sidebar a{
display:block;
padding:15px 25px;
text-decoration:none;
color:#2b2b2b;
font-size:18px;
transition:0.3s;
}

.sidebar a:hover{
background:#2b2b2b;
color:white;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.3);
display:none;
z-index:15;
}

.overlay.active{
display:block;
}

/* CONTENT */
.content{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

</style>
</head>

<body>

<!-- HAMBURGER -->
<div class="menu-btn" onclick="openMenu()">
☰ <span style="font-size:14px; margin-left:8px;">MENU</span>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<a href="bougies.html">Bougies parfumées</a>
<a href="fondants.html">Fondants parfumés</a>
<a href="sprays.html">Sprays d’ambiance</a>
<a href="voiture.html">Diffuseur voiture</a>
<a href="bouquet.html">Bouquet parfumé</a>

</div>

<!-- TITRE -->
<div class="header">
La Fabrik' de Lilly
</div>

<script>

function openMenu(){
document.getElementById("sidebar").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
document.getElementById("sidebar").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

</script>

</body>

</html>
