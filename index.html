<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrik' de Lilly</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
color:#2b2b2b;

background:
linear-gradient(rgba(255,255,255,0.30),rgba(255,255,255,0.30)),
url("images/logo-ll.jpg") center center / 50% no-repeat fixed,
linear-gradient(180deg,#f8f4ef,#efe5dd);

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

/* CONTENU */

.hero{
padding:40px;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(4px);
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
max-width:600px;
width:90%;
}

/* TITRE */

h1{
font-size:55px;
margin-bottom:10px;
font-weight:400;
letter-spacing:1px;
}

.subtitle{
font-size:20px;
margin-bottom:35px;
color:#5e5e5e;
line-height:1.6;
}

/* BOUTON */

.btn{
display:inline-block;
padding:16px 35px;
background:#2b2b2b;
color:white;
text-decoration:none;
border-radius:40px;
font-size:16px;
transition:0.3s;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.btn:hover{
transform:translateY(-3px);
background:#444;
}

/* PETIT TEXTE */

.bottom{
margin-top:30px;
font-size:13px;
letter-spacing:2px;
opacity:0.7;
}

/* MOBILE */

@media(max-width:768px){

h1{
font-size:38px;
}

.subtitle{
font-size:16px;
}

.hero{
padding:30px 20px;
}

}

</style>
</head>

<body>

<div class="hero">

<h1>La Fabrik' de Lilly</h1>

<p class="subtitle">
Bougies parfumées artisanales, fondants, sprays d’ambiance et créations parfumées conçues avec passion.
</p>

<a class="btn" href="menu.html">
Découvrir la boutique
</a>

<p class="bottom">
PARFUMS D’INTÉRIEUR • ARTISANAL • ÉLÉGANT
</p>

</div>

</body>
</html>
