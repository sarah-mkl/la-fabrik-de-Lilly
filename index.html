<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrik' de Lilly</title>

<style>

body{
    margin:0;
    font-family:Georgia, serif;
    background:#f8f4ef;
    color:#2b2b2b;
}

/* HEADER */

header{
    position:absolute;
    top:0;
    width:100%;
    z-index:10;
    padding:25px 0;
    text-align:center;
}

/* TITRE A LA PLACE DU MENU */
.brand{
    font-size:18px;
    letter-spacing:3px;
    color:#000;
}

/* HERO */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;

    /* LOGO EN FOND */
    background:
        linear-gradient(rgba(248,244,239,0.80), rgba(248,244,239,0.80)),
        url("images/logo-ll.jpg")
        center center / 50% no-repeat;
}

.hero-content{
    max-width:800px;
    margin-top:-600px;
}

/* TITRE */
.hero h1{
    font-size:65px;
    font-weight:300;
    letter-spacing:4px;
    margin-bottom:30px;
}

/* BOUTON */
.btn{
    display:inline-block;
    margin-top:120px;
    padding:15px 30px;
    background:#2b2b2b;
    color:white;
    text-decoration:none;
    border-radius:40px;
    letter-spacing:2px;
    transition:0.3s;
}

.btn:hover{
    background:#b08968;
}

/* VALUES */

.values{
    background:#efe5dd;
    padding:80px 20px;
    text-align:center;
}

/* FOOTER */

footer{
    text-align:center;
    padding:40px;
    color:#888;
    font-size:13px;
    border-top:1px solid #eee;
}

</style>

</head>

<body>



<section class="hero">

<div class="hero-content">

<h1>La Fabrik’ de Lilly</h1>

<a href="boutique.html" class="btn">
Découvrir la boutique
</a>

</div>

</section>

<section class="values">

<h2>Notre engagement</h2>

<p>
Bougies artisanales à la cire de soja 100% végétale et parfums de Grasse.
</p>

</section>

<footer>
© 2026 La Fabrik' de Lilly
</footer>

</body>
</html>
