<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boutique - La Fabrik' de Lilly</title>

<style>

body{
  margin:0;
  font-family:Georgia, serif;
  background:
  linear-gradient(rgba(255,255,255,0.65),rgba(255,255,255,0.65)),
  url("images/logo-ll.jpg") center/70% no-repeat fixed,
  linear-gradient(180deg,#f8f4ef,#efe5dd);
  color:#2b2b2b;
}

header{
  text-align:center;
  padding:25px;
  background:rgba(255,255,255,0.85);
  border-bottom:1px solid #eee;
}

nav{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:15px;
  background:rgba(255,255,255,0.85);
}

nav a{
  text-decoration:none;
  color:#2b2b2b;
}

h2{
  text-align:center;
  margin-top:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  padding:30px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.price{
  color:#b08968;
  font-weight:bold;
}

button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  background:#2b2b2b;
  color:white;
  border-radius:20px;
  cursor:pointer;
}

/* PANIER */
#cart-btn{
  position:fixed;
  top:20px;
  right:20px;
  background:#2b2b2b;
  color:white;
  border:none;
  padding:12px;
  border-radius:50%;
  cursor:pointer;
}

#cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
}

#cart{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:white;
  transition:0.3s;
  display:flex;
  flex-direction:column;
}

#cart.open{ right:0; }
#cart-overlay.show{ display:block; }

.cart-header{
  display:flex;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #eee;
}

#cart-items{
  flex:1;
  padding:15px;
}

.cart-footer{
  padding:20px;
  border-top:1px solid #eee;
}

.cart-footer button{
  width:100%;
  margin-top:10px;
}

</style>
</head>

<body>

<button id="cart-btn" onclick="toggleCart()">🛒</button>
<div id="cart-overlay" onclick="toggleCart()"></div>

<div id="cart">

  <div class="cart-header">
    <h3>Panier</h3>
    <span onclick="toggleCart()" style="cursor:pointer;">✖</span>
  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <p>Total : <span id="cart-total">0</span>€</p>

    <button onclick="window.location.href='paiement.html'">
      Valider commande
    </button>

    <button onclick="viderPanier()">
      Vider panier
    </button>
  </div>

</div>

<header>
  <h1>La Fabrik' de Lilly</h1>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="boutique.html">Boutique</a>
</nav>

<h2>🛍️ Nos produits</h2>

<div class="grid">

  <div class="card">
    <h3>Bougie 80g</h3>
    <p class="price">8€</p>
    <a href="produit.html?nom=Bougie%2080g&prix=8">Voir produit</a>
    <button onclick="add('Bougie 80g',8)">Ajouter</button>
  </div>

  <div class="card">
    <h3>Fondant 12g</h3>
    <p class="price">4€</p>
    <a href="produit.html?nom=Fondant%2012g&prix=4">Voir produit</a>
    <button onclick="add('Fondant 12g',4)">Ajouter</button>
  </div>

  <div class="card">
    <h3>Spray 50ml</h3>
    <p class="price">6€</p>
    <a href="produit.html?nom=Spray%2050ml&prix=6">Voir produit</a>
    <button onclick="add('Spray 50ml',6)">Ajouter</button>
  </div>

  <div class="card">
    <h3>Diffuseur voiture</h3>
    <p class="price">4€</p>
    <a href="produit.html?nom=Diffuseur%20voiture&prix=4">Voir produit</a>
    <button onclick="add('Diffuseur voiture',4)">Ajouter</button>
  </div>

</div>

<script>

let panier = JSON.parse(localStorage.getItem("panier")) || [];

function save(){
  localStorage.setItem("panier", JSON.stringify(panier));
}

function add(nom, prix){
  panier.push({nom, prix});
  save();
  render();
  openCart();
}

function render(){
  let box = document.getElementById("cart-items");
  let total = 0;

  box.innerHTML = "";

  panier.forEach((p,i)=>{
    total += p.prix;

    let d = document.createElement("div");
    d.innerHTML = `${p.nom} - ${p.prix}€ 
    <button onclick="removeItem(${i})"
    style="float:right;background:red;color:white;border:none;border-radius:8px;">X</button>`;
    d.style.padding="8px";
    d.style.borderBottom="1px solid #eee";

    box.appendChild(d);
  });

  document.getElementById("cart-total").textContent = total;
}

function removeItem(i){
  panier.splice(i,1);
  save();
  render();
}

function viderPanier(){
  panier = [];
  save();
  render();
}

function toggleCart(){
  document.getElementById("cart").classList.toggle("open");
  document.getElementById("cart-overlay").classList.toggle("show");
}

function openCart(){
  document.getElementById("cart").classList.add("open");
  document.getElementById("cart-overlay").classList.add("show");
}

window.onload = render;

</script>

</body>
</html>
