<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrik' de Lilly</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
background:#f8f4ef;
height:100vh;
overflow:hidden;
color:#2b2b2b;
}

/* LOGO = ELEMENT PRINCIPAL */
body::before{
content:"";
position:fixed;
inset:0;
background:url("images/logo-ll.jpg") center/80% no-repeat;
opacity:0.35;
z-index:-1;
}

/* TITRE SIMPLE EN HAUT */
header{
position:absolute;
top:25px;
width:100%;
text-align:center;
font-size:34px;
font-weight:400;
letter-spacing:2px;
}

/* BAS SIMPLE */
.footer{
position:absolute;
bottom:50px;
width:100%;
text-align:center;
}

.footer p{
margin:0 0 20px 0;
font-size:16px;
color:#555;
}

/* BOUTON PROPRE */
.btn{
display:inline-block;
padding:14px 35px;
background:#2b2b2b;
color:white;
text-decoration:none;
border-radius:40px;
transition:0.3s;
letter-spacing:1px;
}

.btn:hover{
background:#444;
transform:translateY(-3px);
}

/* RESPONSIVE */
@media(max-width:768px){
body::before{
background-size:95%;
opacity:0.30;
}
header{
font-size:26px;
}
}

</style>
</head>

<body>

<header>
La Fabrik' de Lilly
</header>

<div class="footer">

<p>
Bougies artisanales • Parfums de Grasse • Fabrication soignée
</p>

<a class="btn" href="menu.html">
Découvrir la boutique
</a>

</div>

</body>
</html>
