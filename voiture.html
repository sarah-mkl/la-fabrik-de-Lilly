<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diffuseur voiture</title>

<style>
body{margin:0;font-family:Georgia,serif;background:#f8f4ef;color:#2b2b2b;}
.header{text-align:center;padding:25px;font-size:38px;}
.container{display:flex;justify-content:space-between;align-items:center;padding:60px 10%;gap:40px;}
.text{flex:1;font-size:16px;line-height:1.9;color:#555;}
.image{flex:1;text-align:center;}
.image img{width:100%;max-width:430px;border-radius:25px;box-shadow:0 10px 25px rgba(0,0,0,0.15);}
.banner{text-align:center;margin-top:60px;padding:30px;background:#efe5dd;font-size:28px;}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:40px 10%;}

.cat{
text-decoration:none;
color:#2b2b2b;
background:white;
padding:25px;
border-radius:22px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.35s ease;
position:relative;
overflow:hidden;
display:block;
}

.cat::before{
content:"";
position:absolute;
inset:-2px;
background:radial-gradient(circle at top left,
rgba(176,137,104,0.5),
transparent 60%);
opacity:0;
transition:0.4s;
}

.cat:hover{
transform:translateY(-8px) scale(1.03);
box-shadow:0 18px 50px rgba(0,0,0,0.18);
border:1px solid rgba(176,137,104,0.6);
}

.cat:hover::before{opacity:1;}
.cat p{color:#666;}
</style>

</head>

<body>

<div class="header">Diffuseur voiture</div>

<div class="container">

<div class="text">
Parfumez vos trajets avec élégance et subtilité.<br><br>
</div>

<div class="image">
<img src="https://images.unsplash.com/photo-1603386329225-868f9b1ee6d7?q=80&w=1200&auto=format&fit=crop">
</div>

</div>

<div class="banner">Choisissez la famille olfactive qui vous correspond</div>

<div class="categories">

<a class="cat"><h3>Gourmand</h3><p>Chaud</p></a>
<a class="cat"><h3>Floral</h3><p>Frais</p></a>
<a class="cat"><h3>Boisé</h3><p>Puissant</p></a>
<a class="cat"><h3>Fraîcheur</h3><p>Léger</p></a>

</div>

</body>
</html>
