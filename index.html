<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrik' de Lilly</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
height:100vh;
overflow:hidden;
background:#f8f4ef;
color:#2b2b2b;
}

/* LOGO FLOTTANT + TEINTE ROSÉE */
.logo-bg{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:720px;
opacity:0.22;
z-index:-1;
animation: float 6s ease-in-out infinite;

/* 🌸 effet rose élégant */
filter:
brightness(1.05)
contrast(1.05)
sepia(0.18)
saturate(1.35)
hue-rotate(-12deg);
}

/* ANIMATION FLOTTEMENT */
@keyframes float{
0%{transform:translate(-50%,-50%) translateY(0px);}
50%{transform:translate(-50%,-50%) translateY(-18px);}
100%{transform:translate(-50%,-50%) translateY(0px);}
}

/* TITRE EN HAUT (PLUS PRO) */
.header{
position:absolute;
top:25px;
width:100%;
text-align:center;
font-size:46px;
font-weight:400;
letter-spacing:3px;
color:#111;
}

/* BAS */
.footer{
position:absolute;
bottom:60px;
width:100%;
text-align:center;
}

/* TEXTE BAS */
.footer p{
font-size:16px;
color:#555;
margin-bottom:20px;
line-height:1.6;
}

/* BOUTON */
.btn{
display:inline-block;
padding:15px 40px;
background:#2b2b2b;
color:white;
text-decoration:none;
border-radius:40px;
letter-spacing:2px;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.btn:hover{
background:#444;
transform:translateY(-3px);
}

/* RESPONSIVE */
@media(max-width:768px){

.logo-bg{
width:480px;
}

.header{
font-size:32px;
}

}

</style>
</head>

<body>

<!-- LOGO -->
<img class="logo-bg" src="images/logo-ll.jpg">

<!-- HEADER -->
<div class="header">
La Fabrik' de Lilly
</div>

<!-- BAS -->
<div class="footer">

<p>
Bougies artisanales • Parfums de Grasse • Créations faites avec passion
</p>

<a class="btn" href="menu.html">
Découvrir la boutique
</a>

</div>

</body>
</html>
