<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paiement - La Fabrik' de Lilly</title>

<style>

body{
  margin:0;
  font-family:Georgia, serif;
  background:
  linear-gradient(rgba(255,255,255,0.75),rgba(255,255,255,0.75)),
  url("images/logo-ll.jpg") center/70% no-repeat fixed,
  linear-gradient(180deg,#f8f4ef,#efe5dd);
  color:#2b2b2b;
}

header{
  text-align:center;
  padding:25px;
  background:rgba(255,255,255,0.85);
  border-bottom:1px solid #eee;
}

.container{
  max-width:800px;
  margin:auto;
  padding:40px 20px;
}

.box{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
}

.total{
  text-align:center;
  font-size:22px;
  margin-top:15px;
  font-weight:bold;
  color:#b08968;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-family:inherit;
}

.whatsapp{
  background:#25D366;
  color:white;
}

.clear{
  background:#2b2b2b;
  color:white;
}

.back{
  background:#ddd;
}

</style>
</head>

<body>

<header>
<h1>Validation commande</h1>
</header>

<div class="container">

<div class="box">

<h2>Récapitulatif</h2>

<div id="liste"></div>

<p class="total">Total : <span id="total">0</span> €</p>

<button class="whatsapp" onclick="sendWhatsApp()">
Commander sur WhatsApp
</button>

<button class="clear" onclick="viderPanier()">
Vider le panier
</button>

<button class="back" onclick="window.location.href='boutique.html'">
← Retour boutique
</button>

</div>

</div>

<script>

let panier = JSON.parse(localStorage.getItem("panier")) || [];

function afficher(){

  let liste = document.getElementById("liste");
  let total = 0;

  liste.innerHTML = "";

  panier.forEach(p => {
    total += p.prix;

    let div = document.createElement("div");
    div.className = "item";
    div.textContent = p.nom + " - " + p.prix + "€";
    liste.appendChild(div);
  });

  document.getElementById("total").textContent = total;
}

function sendWhatsApp(){

  if(panier.length === 0){
    alert("Ton panier est vide !");
    return;
  }

  let msg = "🌸 Nouvelle commande La Fabrik' de Lilly 🌸%0A%0A";
  let total = 0;

  panier.forEach(p => {
    msg += "• " + p.nom + " - " + p.prix + "€%0A";
    total += p.prix;
  });

  msg += "%0A💰 Total : " + total + "€";

  let phone = "33651461324";

  window.open("https://wa.me/" + phone + "?text=" + msg);
}

function viderPanier(){
  panier = [];
  localStorage.setItem("panier", JSON.stringify(panier));
  afficher();
}

window.onload = afficher;

</script>

</body>
</html>
