<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produit - La Fabrik' de Lilly</title>

<style>

body{
  font-family:Georgia, serif;
  background:#faf7f2;
  margin:0;
  color:#2b2b2b;
}

/* HEADER */

header{
  text-align:center;
  padding:30px;
  background:#fff;
  border-bottom:1px solid #e6e0d8;
}

header h1{
  margin:0;
  font-weight:400;
  letter-spacing:2px;
}

/* NAV */

nav{
  text-align:center;
  padding:15px;
  background:#fff;
  border-bottom:1px solid #eee;
}

nav a{
  margin:0 15px;
  text-decoration:none;
  color:#2b2b2b;
  font-size:14px;
  letter-spacing:1px;
}

nav a:hover{
  color:#b08968;
}

/* CONTAINER */

.container{
  max-width:850px;
  margin:auto;
  padding:40px 20px;
}

/* BOX */

.box{
  background:#fff;
  padding:35px;
  border:1px solid #eee;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
  border-radius:20px;
}

/* IMAGE */

.produit-image{
  width:100%;
  border-radius:15px;
  margin-bottom:25px;
}

/* TITRES */

h2,
h3{
  font-weight:400;
  letter-spacing:1px;
}

/* TEXTE */

#description-produit{
  line-height:1.7;
  color:#444;
}

#notes-parfum{
  font-style:italic;
  color:#666;
}

/* SELECT */

select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:inherit;
  background:white;
}

/* BUTTON */

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  font-family:inherit;
  border:none;
  border-radius:30px;
  background:#2b2b2b;
  color:white;
  cursor:pointer;
  transition:0.3s;
  font-size:15px;
}

button:hover{
  background:#b08968;
}

/* PANIER */

#panier{
  position:fixed;
  right:20px;
  bottom:20px;
  width:260px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

#panier h3{
  margin-top:0;
  text-align:center;
}

#liste-panier{
  margin:15px 0;
  max-height:200px;
  overflow-y:auto;
}

.panier-item{
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.total{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#b08968;
  margin-top:15px;
}

.btn-whatsapp{
  background:#25D366;
}

.btn-whatsapp:hover{
  background:#1ebe5d;
}

/* RESPONSIVE */

@media(max-width:768px){

  #panier{
    width:90%;
    right:5%;
    bottom:10px;
  }

}

</style>

</head>

<body>

<header>

<h1>La Fabrik' de Lilly</h1>

</header>

<nav>

<a href="index.html">Accueil</a>
<a href="boutique.html">Boutique</a>

</nav>

<div class="container">

<div class="box">

<img
class="produit-image"
src="https://images.unsplash.com/photo-1603006905003-be475563bc59?q=80&w=1200&auto=format&fit=crop"
>

<h2>🕯️ Bougie 80g</h2>

<p><strong>Prix :</strong> 8€</p>

<label>🌸 Choisis ton parfum</label>

<select id="parfum" onchange="changerParfum()">

<option value="">-- Sélectionner --</option>

<option value="Fleur de cerisier">Fleur de cerisier</option>
<option value="Fleur d’acacia">Fleur d’acacia</option>
<option value="Fleur de coton">Fleur de coton</option>
<option value="Orchidée">Orchidée</option>
<option value="Lavande">Lavande</option>
<option value="Jasmin">Jasmin</option>
<option value="Lys blanc">Lys blanc</option>
<option value="Azalée du Japon">Azalée du Japon</option>
<option value="Hibiscus">Hibiscus</option>
<option value="Frangipanier">Frangipanier</option>

<option value="Barbe à papa">Barbe à papa</option>
<option value="Madeleine gourmande">Madeleine gourmande</option>
<option value="Douce couverture">Douce couverture</option>
<option value="Pomme d’amour">Pomme d’amour</option>

<option value="Linge propre">Linge propre</option>
<option value="Adoucissant">Adoucissant</option>

<option value="Monoï pêche">Monoï pêche</option>
<option value="Monoï clémentine">Monoï clémentine</option>
<option value="Pomme verte">Pomme verte</option>
<option value="Litchi">Litchi</option>
<option value="Melon">Melon</option>
<option value="Pastèque">Pastèque</option>
<option value="Fruit rouge">Fruit rouge</option>
<option value="Smoothie">Smoothie</option>

<option value="Bois de oud">Bois de oud</option>

</select>

<h3>📝 Descriptif</h3>

<p id="description-produit">
Choisis un parfum.
</p>

<h3>🧪 Notes olfactives</h3>

<p id="notes-parfum">
---
</p>

<button onclick="ajouterPanier()">
Ajouter au panier
</button>

</div>

</div>

<!-- PANIER -->

<div id="panier">

<h3>🛒 Mon panier</h3>

<div id="liste-panier"></div>

<p class="total">
Total : <span id="total">0</span> €
</p>

<button class="btn-whatsapp" onclick="commanderWhatsApp()">
Commander sur WhatsApp
</button>

</div>

<script>

let parfumChoisi = "";

let panier = [];

/* PARFUMS */

const data = {

  "Fleur de coton":{
    desc:"Fleur de Coton : douceur et pureté.",
    notes:"Tête : aldéhydes | Cœur : coton | Fond : musc blanc"
  },

  "Fleur de cerisier":{
    desc:"Fleur de Cerisier : floral doux et élégant.",
    notes:"Tête : fruits rouges | Cœur : fleur de cerisier | Fond : musc"
  },

  "Lavande":{
    desc:"Lavande : relaxante et apaisante.",
    notes:"Tête : lavande | Cœur : lavandin | Fond : bois"
  },

  "Barbe à papa":{
    desc:"Barbe à papa : sucré et régressif.",
    notes:"Tête : sucre | Cœur : vanille | Fond : caramel"
  },

  "Bois de oud":{
    desc:"Bois de oud : luxe et intense.",
    notes:"Tête : épices | Cœur : oud | Fond : ambre"
  }

};

/* CHANGER PARFUM */

function changerParfum(){

  parfumChoisi =
  document.getElementById("parfum").value;

  if(!parfumChoisi){

    document.getElementById(
      "description-produit"
    ).innerText =
    "Choisis un parfum.";

    document.getElementById(
      "notes-parfum"
    ).innerText =
    "---";

    return;
  }

  if(data[parfumChoisi]){

    document.getElementById(
      "description-produit"
    ).innerText =
    data[parfumChoisi].desc;

    document.getElementById(
      "notes-parfum"
    ).innerText =
    data[parfumChoisi].notes;

  } else {

    document.getElementById(
      "description-produit"
    ).innerText =
    parfumChoisi;

    document.getElementById(
      "notes-parfum"
    ).innerText =
    "Notes parfumées raffinées.";
  }

}

/* AJOUT PANIER */

function ajouterPanier(){

  if(!parfumChoisi){

    alert("Choisis un parfum !");

    return;
  }

  panier.push({

    nom:
    "Bougie 80g - " + parfumChoisi,

    prix:8

  });

  afficherPanier();
}

/* AFFICHAGE PANIER */

function afficherPanier(){

  let liste =
  document.getElementById("liste-panier");

  let totalElement =
  document.getElementById("total");

  liste.innerHTML = "";

  let total = 0;

  panier.forEach(item => {

    total += item.prix;

    liste.innerHTML += `

      <div class="panier-item">

        ${item.nom}

        - ${item.prix} €

      </div>

    `;
  });

  totalElement.innerText =
  total.toFixed(2);
}

/* WHATSAPP */

function commanderWhatsApp(){

  if(panier.length === 0){

    alert("Le panier est vide");

    return;
  }

  let message =
  "Bonjour, je souhaite commander :%0A%0A";

  let total = 0;

  panier.forEach(item => {

    message +=
    `- ${item.nom}%0A`;

    total += item.prix;
  });

  message +=
  `%0ATotal : ${total.toFixed(2)}€`;

  let numero = "33651461324";

  window.open(
    `https://wa.me/${numero}?text=${message}`,
    "_blank"
  );
}

</script>

</body>
</html>
