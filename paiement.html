<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement</title>

<style>
body{
font-family:Georgia;
background:#f8f4ef;
text-align:center;
padding:30px;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:12px;
background:#25D366;
color:white;
border:none;
border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>Validation commande</h2>

<div id="list"></div>

<p>Total: <span id="total"></span>€</p>

<button onclick="send()">Commander WhatsApp</button>

</div>

<script>

let panier=JSON.parse(localStorage.getItem("panier"))||[];

function load(){

let t=0;
let html="";

panier.forEach(p=>{
t+=p.prix;
html+=`<p>${p.nom} - ${p.prix}€</p>`;
});

document.getElementById("list").innerHTML=html;
document.getElementById("total").innerText=t;

}

function send(){

let msg="🌸 Commande La Fabrik' de Lilly 🌸%0A%0A";

let t=0;

panier.forEach(p=>{
msg+=p.nom+" - "+p.prix+"€%0A";
t+=p.prix;
});

msg+="%0A💰 Total : "+t+"€";

window.open("https://wa.me/33651461324?text="+msg);

}

load();

</script>

</body>
</html>
