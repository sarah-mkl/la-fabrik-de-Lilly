<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Produit - La Fabrik' de Lilly</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>La Fabrik' de Lilly</h1>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="boutique.html">Boutique</a>
</nav>

<main class="accueil">

  <h2 id="nom-produit">Détail produit</h2>

  <div class="produit">

    <p><strong>Prix :</strong> <span id="prix-produit">0</span>€</p>

    <p id="description-produit">
      Description du produit.
    </p>

    <button onclick="ajouterPanier()">Ajouter au panier</button>

  </div>

</main>

  <script>
const params = new URLSearchParams(window.location.search);

const nom = params.get("nom");
const prix = params.get("prix");
const desc = params.get("desc");

if (nom) document.getElementById("nom-produit").textContent = nom;
if (prix) document.getElementById("prix-produit").textContent = prix;
if (desc) document.getElementById("description-produit").textContent = desc;

function ajouterPanier() {
  alert(nom + " ajouté au panier !");
}
</script>

</body>
</html>
