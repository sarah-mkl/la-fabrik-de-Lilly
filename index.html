<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrik' de Lilly</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
color:#2b2b2b;
min-height:100vh;
overflow:hidden;
text-align:center;
background: linear-gradient(180deg,#f8f4ef,#efe5dd);
}

/* ANIMATION ENTREE */
body{
animation: fadeIn 1.2s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

/* LOGO FOND (IMPORTANT: visible + simple) */
.logo-bg{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:450px;
opacity:0.12;
z-index:-1;
}

/* TITRE */
.header{
position:absolute;
top:20px;
width:100%;
font-size:28px;
font-weight:400;
}

/* BOX */
.hero{
margin-top:120px;
display:inline-block;
padding:40px;
background:rgba(255,255,255,0.6);
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
max-width:600px;
width:90%;
}

h1{
font-size:55px;
margin-bottom:10px;
font-weight:400;
}

.subtitle{
font-size:20px;
margin-bottom:35px;
color:#5e5e5e;
line-height:1.6;
}

.btn{
display:inline-block;
padding:16px 35px;
background:#2b2b2b;
color:white;
text-decoration:none;
border-radius:40px;
}

.btn:hover{
background:#444;
}

.bottom{
margin-top:30px;
font-size:13px;
opacity:0.7;
}

/* MOBILE */
@media(max-width:768px){
h1{font-size:38px;}
.logo-bg{width:280px;}
}

</style>
</head>

<body>

<!-- LOGO -->
<img class="logo-bg" src="images/logo-ll.jpg" alt="logo">

<!-- TITRE -->
<div class="header">
La Fabrik' de Lilly
</div>

<!-- CONTENU -->
<div class="hero">

<h1>Bienvenue</h1>

<p class="subtitle">
Bougies parfumées artisanales, fondants, sprays d’ambiance et créations parfumées.
</p>

<a class="btn" href="menu.html">
Découvrir la boutique
</a>

<p class="bottom">
PARFUMS D’INTÉRIEUR • ARTISANAL • ÉLÉGANT
</p>

</div>

</body>
</html>
