<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Produit - La Fabrik' de Lilly</title>

<style>

body {
  font-family: Georgia, serif;
  background: #faf7f2;
  margin: 0;
  color: #2b2b2b;
}

header {
  text-align: center;
  padding: 30px;
  background: #fff;
  border-bottom: 1px solid #e6e0d8;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 40px 20px;
}

.box {
  background: #fff;
  padding: 30px;
  border: 1px solid #eee;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  font-family: inherit;
}

button {
  background: #2b2b2b;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #444;
}

/* PANIER */
#panier {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 260px;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

.total {
  text-align: center;
  font-size: 20px;
  color: #b08968;
  font-weight: bold;
}

.btn-whatsapp {
  background: #25D366;
}

.btn-whatsapp:hover {
  background: #1ebe5d;
}

</style>
</head>

<body>

<header>
  <h1>La Fabrik' de Lilly</h1>
</header>

<div class="container">

  <div class="box">

    <h2 id="titre-produit">Produit</h2>

    <p><strong>Prix :</strong> <span id="prix"></span> €</p>

    <label>Choisis ton parfum</label>

    <select id="parfum" onchange="changerParfum()">
      <option value="">-- Sélectionner --</option>
      <option value="coton">Fleur de coton</option>
      <option value="cerisier">Fleur de cerisier</option>
      <option value="lavande">Lavande</option>
      <option value="jasmin">Jasmin</option>
      <option value="oud">Bois de oud</option>
    </select>

    <p id="description">Choisis un parfum</p>
    <p id="notes"></p>

    <button onclick="ajouterPanier()">Ajouter au panier</button>

  </div>

</div>

<!-- PANIER -->
<div id="panier">

  <h3>🛒 Panier</h3>

  <div id="liste"></div>

  <p class="total">Total : <span id="total">0</span> €</p>

  <button class="btn-whatsapp" onclick="whatsapp()">
    Commander
  </button>

</div>

<script>

/* 🔥 ICI TU CHANGES JUSTE ÇA */
let produitActuel = "Bougie 80g";   // 👉 change ici (Bougie / Spray / Fondant)
let prixProduit = 8;               // 👉 change ici prix

document.getElementById("titre-produit").textContent = produitActuel;
document.getElementById("prix").textContent = prixProduit;

let parfumChoisi = "";
let panier = [];

const data = {
  coton: { desc:"Douceur cocooning", notes:"Coton / musc blanc" },
  cerisier: { desc:"Floral doux", notes:"Fruits rouges / fleur" },
  lavande: { desc:"Relaxant", notes:"Lavande / bois" },
  jasmin: { desc:"Floral intense", notes:"Jasmin / musc" },
  oud: { desc:"Luxe intense", notes:"Bois / épices" }
};

function changerParfum() {

  parfumChoisi = document.getElementById("parfum").value;

  if (!parfumChoisi) return;

  document.getElementById("description").textContent = data[parfumChoisi].desc;
  document.getElementById("notes").textContent = data[parfumChoisi].notes;
}

function ajouterPanier() {

  if (!parfumChoisi) {
    alert("Choisis un parfum !");
    return;
  }

  panier.push({
    nom: produitActuel + " - " + parfumChoisi,
    prix: prixProduit
  });

  afficher();
}

function afficher() {

  let liste = document.getElementById("liste");
  let total = 0;

  liste.innerHTML = "";

  panier.forEach(item => {
    total += item.prix;

    liste.innerHTML += `
      <div>
        ${item.nom} - ${item.prix} €
      </div>
    `;
  });

  document.getElementById("total").textContent = total;
}

function whatsapp() {

  if (panier.length === 0) {
    alert("Panier vide");
    return;
  }

  let msg = "Commande :%0A%0A";
  let total = 0;

  panier.forEach(item => {
    msg += "- " + item.nom + "%0A";
    total += item.prix;
  });

  msg += "%0ATotal : " + total + "€";

  window.open("https://wa.me/33651461324?text=" + msg, "_blank");
}

</script>

</body>
</html>
