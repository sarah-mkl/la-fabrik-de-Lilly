<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produit</title>

<style>

body{
  margin:0;
  font-family:Georgia, serif;
  background:#faf7f2;
  color:#2b2b2b;
}

header{
  text-align:center;
  padding:25px;
  background:white;
  border-bottom:1px solid #eee;
}

.container{
  max-width:800px;
  margin:auto;
  padding:40px 20px;
}

.box{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

select,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
}

button{
  background:#2b2b2b;
  color:white;
  border:none;
}

</style>
</head>

<body>

<header>
<h1>La Fabrik' de Lilly</h1>
</header>

<div class="container">

<div class="box">

<h2 id="titre"></h2>
<p>Prix : <span id="prix"></span>€</p>

<select id="parfum" onchange="changerParfum()">
<option value="">Choisir parfum</option>

<option value="coton">Fleur de coton</option>
<option value="cerisier">Fleur de cerisier</option>
<option value="lavande">Lavande</option>
<option value="jasmin">Jasmin</option>
<option value="oud">Bois de oud</option>
<option value="barbe">Barbe à papa</option>
<option value="monoip">Monoï pêche</option>
<option value="pomme">Pomme verte</option>

</select>

<p id="desc"></p>

<button onclick="ajouter()">Ajouter au panier</button>
<button onclick="window.location.href='boutique.html'">Retour boutique</button>

</div>

</div>

<script>

let panier = JSON.parse(localStorage.getItem("panier")) || [];

function save(){
  localStorage.setItem("panier", JSON.stringify(panier));
}

const params = new URLSearchParams(window.location.search);

let produit = params.get("nom") || "Produit";
let prix = Number(params.get("prix") || 0);

document.getElementById("titre").textContent = produit;
document.getElementById("prix").textContent = prix;

let parfum = "";

function changerParfum(){
  parfum = document.getElementById("parfum").value;
  document.getElementById("desc").textContent = parfum;
}

function ajouter(){

  if(!parfum){
    alert("Choisis un parfum");
    return;
  }

  panier.push({
    nom: produit + " - " + parfum,
    prix: prix
  });

  save();

  alert("Ajouté au panier !");
}

</script>

</body>
</html>
