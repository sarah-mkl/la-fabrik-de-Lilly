<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boutique - La Fabrik' de Lilly</title>

<style>

body{
  margin:0;
  font-family:Georgia, serif;
  background:
  linear-gradient(rgba(255,255,255,0.65),rgba(255,255,255,0.65)),
  url("images/logo-ll.jpg") center/70% no-repeat fixed,
  linear-gradient(180deg,#f8f4ef,#efe5dd);
  color:#2b2b2b;
}

/* HEADER */

header{
  text-align:center;
  padding:25px;
  background:rgba(255,255,255,0.85);
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-weight:300;
  letter-spacing:2px;
}

/* NAV */

nav{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:15px;
  background:rgba(255,255,255,0.85);
  border-bottom:1px solid #eee;
}

nav a{
  text-decoration:none;
  color:#2b2b2b;
  font-size:13px;
  letter-spacing:2px;
}

/* TITRES */

h2{
  text-align:center;
  margin-top:50px;
  font-weight:300;
  letter-spacing:2px;
}

/* GRID PRODUITS */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  padding:30px;
  max-width:1100px;
  margin:auto;
}

/* CARD */

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.price{
  color:#b08968;
  font-size:20px;
  font-weight:bold;
}

/* BOUTON */

button{
  background:#2b2b2b;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:25px;
  cursor:pointer;
}

/* TAGS */

.tags{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:30px;
}

.tags span{
  background:white;
  padding:8px 14px;
  border-radius:25px;
  border:1px solid #eee;
}

/* ============ PANIER SHOPIFY ============ */

#cart-btn{
  position:fixed;
  top:20px;
  right:20px;
  background:#2b2b2b;
  color:white;
  border:none;
  padding:12px 15px;
  border-radius:50px;
  cursor:pointer;
  z-index:1000;
}

/* overlay */
#cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:999;
}

/* panier */
#cart{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:white;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  transition:0.3s;
  z-index:1000;
  display:flex;
  flex-direction:column;
}

#cart.open{
  right:0;
}

#cart-overlay.show{
  display:block;
}

/* header panier */
.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  border-bottom:1px solid #eee;
}

.cart-header span{
  cursor:pointer;
  font-size:18px;
}

/* items */
#cart-items{
  flex:1;
  padding:15px;
  overflow:auto;
}

#cart-items div{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

/* footer */
.cart-footer{
  padding:20px;
  border-top:1px solid #eee;
}

.cart-footer button{
  width:100%;
  margin-top:10px;
}

</style>
</head>

<body>

<!-- PANIER -->
<button id="cart-btn" onclick="toggleCart()">🛒</button>

<div id="cart-overlay" onclick="toggleCart()"></div>

<div id="cart">

  <div class="cart-header">
    <h3>Ton panier</h3>
    <span onclick="toggleCart()">✖</span>
  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <p>Total : <strong><span id="cart-total">0</span>€</strong></p>
    <button onclick="viderPanier()">Vider le panier</button>
  </div>

</div>

<!-- HEADER -->
<header>
  <h1>La Fabrik' de Lilly</h1>
</header>

<!-- NAV -->
<nav>
  <a href="index.html">Accueil</a>
  <a href="boutique.html">Boutique</a>
  <a href="#">À propos</a>
</nav>

<!-- PRODUITS -->
<h2>Nos produits</h2>

<div class="grid">

  <div class="card">
    <h3>Bougie 80g</h3>
    <p class="price">8€</p>
    <button onclick="ajouterAuPanier('Bougie 80g',8)">Ajouter</button>
  </div>

  <div class="card">
    <h3>Fondant 12g</h3>
    <p class="price">4€</p>
    <button onclick="ajouterAuPanier('Fondant 12g',4)">Ajouter</button>
  </div>

  <div class="card">
    <h3>Spray 50ml</h3>
    <p class="price">6€</p>
    <button onclick="ajouterAuPanier('Spray 50ml',6)">Ajouter</button>
  </div>

  <div class="card">
    <h3>Diffuseur voiture</h3>
    <p class="price">4€</p>
    <button onclick="ajouterAuPanier('Diffuseur voiture',4)">Ajouter</button>
  </div>

</div>

<!-- PARFUMS -->
<h2>Parfums</h2>

<div class="tags">
  <span>Fleur de coton</span>
  <span>Jasmin</span>
  <span>Lavande</span>
  <span>Vanille</span>
  <span>Oud</span>
</div>

<script>

let panier = [];

function ajouterAuPanier(nom, prix){
  panier.push({nom, prix});
  afficherPanier();
  ouvrirCart();
}

function afficherPanier(){

  let items = document.getElementById("cart-items");
  let totalEl = document.getElementById("cart-total");

  items.innerHTML = "";

  let total = 0;

  panier.forEach(p => {
    let div = document.createElement("div");
    div.textContent = p.nom + " - " + p.prix + "€";
    items.appendChild(div);
    total += p.prix;
  });

  totalEl.textContent = total;

}

function viderPanier(){
  panier = [];
  afficherPanier();
}

function toggleCart(){
  document.getElementById("cart").classList.toggle("open");
  document.getElementById("cart-overlay").classList.toggle("show");
}

function ouvrirCart(){
  document.getElementById("cart").classList.add("open");
  document.getElementById("cart-overlay").classList.add("show");
}

</script>

</body>
</html>
